name: Windows Python isolation acceptance (security changes)

# Only this dedicated branch may run. Neither a push nor a dispatch checkbox
# grants security authorization. Obtain prior explicit external action-time
# approval for this exact reviewed commit and fresh disposable win22 lifecycle,
# including the synthetic Everyone Modify leaf, cap-only/upstream-DACL token
# candidate, two dedicated-account outbound ALE connect blocks and loopback canaries.
on:
  push:
    branches: [lab/python-isolation-acceptance]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed full lowercase SHA, exactly equal to the selected workflow commit (github.sha)'
        required: true
        type: string
      approved_security_changes:
        description: 'Prior external approval: fresh win22 VM, PiSandboxOffline, C:\PiSandboxLab ACL/store, synthetic outside-world Everyone Modify, product firewall/WFP plus 2 account-only V4/V6 outbound connect blocks, cap-only/upstream-DACL Python candidate, loopback/child canaries, disable/dispose'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python-isolation-acceptance:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Guard exact repository, dedicated branch and immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PUSH_DELETED: ${{ github.event.deleted }}
          APPROVED_SECURITY_CHANGES: ${{ inputs.approved_security_changes }}
        run: |
          if ($env:EVENT_REPOSITORY -cne 'ni-taesoon/pi-windows-sandbox-poc') { throw 'Unexpected repository.' }
          if ($env:EVENT_REF -cne 'refs/heads/lab/python-isolation-acceptance') { throw 'Only the dedicated Python isolation branch is permitted.' }
          if ($env:EVENT_SHA -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Immutable event SHA required.' }
          if ($env:ImageOS -ne 'win22') { throw 'Only fresh Windows Server 2022 hosted runners are in scope.' }
          if ($env:EVENT_NAME -ceq 'push') {
            if ($env:PUSH_DELETED -cne 'false') { throw 'Branch deletion or unknown push state is not permitted.' }
            # Operator must obtain external approval before pushing. A branch
            # name is an execution guard, never authorization evidence.
          } elseif ($env:EVENT_NAME -ceq 'workflow_dispatch') {
            if ($env:APPROVED_SECURITY_CHANGES -cne 'true') { throw 'Prior security-change approval was not attested.' }
            if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $env:SOURCE_SHA -cne $env:EVENT_SHA) {
              throw 'Manual source_sha must exactly match github.sha; mutable refs are refused.'
            }
          } else { throw 'Unsupported workflow event.' }
      - name: Check out immutable event source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
      - name: Materialize LF bytes and verify pinned checkout
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot materialize byte-stable LF checkout.' }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:SOURCE_SHA) { throw 'Source identity mismatch.' }
          New-Item -ItemType Directory -Path python-isolation-evidence | Out-Null
          [ordered]@{
            sourceCommit=$actual; baselineCommit='be298b70be88b4f418336f34f2676bd67a686ece';
            scope='LAB_PYTHON_ISOLATION_ACCEPTANCE'; nativeValidated=$false;
            labVariant='lab-python-policy-repair-comparison'; additionalAccountConnectFilters=2
          } | ConvertTo-Json | Set-Content -LiteralPath python-isolation-evidence/source-identity.json -Encoding UTF8
      - name: Verify frozen source manifest and closed production gate
        run: |
          . ./scripts/windows_lab_stage_sources.ps1
          $repo = [IO.Path]::GetFullPath($PWD.Path)
          $manifest = Join-Path $repo 'SOURCE_SHA256SUMS.txt'
          Assert-LabSourceAncestors -Path $manifest -Role 'source-manifest'
          if ((Get-Item -LiteralPath $manifest).Length -gt 1048576) { throw 'Source manifest exceeds bound.' }
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $count = 0
          foreach ($line in Get-Content -LiteralPath $manifest) {
            if ($line -cnotmatch '\A([0-9a-f]{64})  ([A-Za-z0-9_./-]+)\z') { throw 'Invalid source manifest entry.' }
            $expected = $Matches[1]
            $name = $Matches[2]
            $parts = @($name.Split('/'))
            if ([IO.Path]::IsPathRooted($name) -or @($parts | Where-Object { $_ -in @('', '.', '..', '.git', '.aws', '.codex', 'target', 'node_modules') -or $_.EndsWith('.') }).Count -ne 0) { throw 'Unsafe source manifest path.' }
            if (-not $seen.Add($name)) { throw 'Duplicate or case-colliding source manifest path.' }
            $path = Join-Path $repo $name
            Assert-LabSourceAncestors -Path $path -Role 'manifest-source'
            if ((Get-Item -LiteralPath $path).PSIsContainer) { throw 'Source manifest entry is a directory.' }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $expected) { throw "Source manifest mismatch: $name" }
            $count++
          }
          foreach ($required in @(
            '.github/workflows/windows-python-isolation.yml',
            'scripts/stage_windows_python_isolation.ps1', 'scripts/windows_lab_stage_sources.ps1',
            'scripts/python-isolation-fixture.py', 'tests/windows-lab/test_python_isolation_sources.py',
            'tests/python-probe/test_isolation_fixture.py',
            'native/windows-sandbox/Cargo.toml', 'native/windows-sandbox/Cargo.lock',
            'native/windows-sandbox/examples/python_isolation_acceptance.rs',
            'native/windows-sandbox/examples/python_isolation_acceptance/windows.rs',
            'native/windows-sandbox/src/python_isolation.rs',
            'native/windows-sandbox/src/python_isolation/broker.rs',
            'native/windows-sandbox/src/python_isolation/observer.rs',
            'native/windows-sandbox/src/python_isolation/token_candidate.rs',
            'native/windows-sandbox/src/token.rs', 'native/windows-sandbox/src/network.rs',
            'native/windows-sandbox/src/network/wfp.rs', 'native/windows-sandbox/src/network/wfp/filter_specs.rs',
            'native/windows-sandbox/tests/wfp_offline_scope_contract.rs',
            'native/windows-sandbox/src/admission.rs', 'native/windows-sandbox/src/admission_plan.rs',
            'native/windows-sandbox/tests/admission_policy_contract.rs',
            'native/windows-sandbox/src/broker.rs', 'native/windows-sandbox/src/lib.rs',
            'native/windows-sandbox/src/main.rs', 'native/windows-sandbox/src/process.rs',
            'native/windows-sandbox/tests/python_isolation_contract.rs')) {
            if (-not $seen.Contains($required)) { throw "Source manifest omits required source: $required" }
          }
          if (-not ((Get-Content -LiteralPath native/windows-sandbox/src/lib.rs) -ccontains 'pub const NATIVE_VALIDATED: bool = false;')) { throw 'Production native gate changed.' }
          [ordered]@{
            sourceManifestSha256=(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash;
            verifiedEntries=$count; allListedFilesMatch=$true; nativeValidated=$false;
            limitation='Source identity only; hashes do not grant authorization or establish Windows security validation.'
          } | ConvertTo-Json | Set-Content -LiteralPath python-isolation-evidence/source-manifest-verification.json -Encoding UTF8
      - name: Select official exact Python runtime before security stages
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, same verified official pin
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
          update-environment: false
      - name: Verify exact official runtime and portable source contracts
        env:
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          $python = $env:PYTHON_EXECUTABLE
          & $python -I -S -B -c "import sys, struct; assert sys.version_info[:3] == (3, 12, 10) and struct.calcsize('P') == 8; print(sys.version)" 2>&1 | Tee-Object -FilePath python-isolation-evidence/python-version.log
          if ($LASTEXITCODE -ne 0) { throw 'Exact Python 3.12.10 x64 unavailable; no staging.' }
          # Source inspection and portable fixture mocks only. No real socket,
          # Windows canary, account, ACL or driver execution is permitted here.
          & $python -I -S -B -m unittest discover -s tests/windows-lab -p test_python_isolation_sources.py -v 2>&1 | Tee-Object -FilePath python-isolation-evidence/source-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable source contracts failed; no security stage.' }
          & $python -I -S -B tests/python-probe/test_isolation_fixture.py -v 2>&1 | Tee-Object -FilePath python-isolation-evidence/fixture-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable fixture mocks failed; no security stage.' }
      - name: Check and build only fixed helper and isolation driver
        env:
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Installed official Rust/MSVC only. No toolchain installers, caches,
          # loader tracing, breakpoint probes, DLL analysis or runtime packages.
          rustup run stable rustc --version --verbose 2>&1 | Tee-Object -FilePath python-isolation-evidence/toolchain.log
          if ($LASTEXITCODE -ne 0) { throw 'Installed official Rust toolchain unavailable.' }
          rustup run stable cargo check --locked --no-default-features --target x86_64-pc-windows-msvc --manifest-path native/windows-sandbox/Cargo.toml --bin pi-windows-sandbox --example python_isolation_acceptance 2>&1 | Tee-Object -FilePath python-isolation-evidence/default-check.log
          if ($LASTEXITCODE -ne 0) { throw 'Default-feature compilation failed; no staging.' }
          rustup run stable cargo check --locked --no-default-features --features lab-python-isolation-acceptance --target x86_64-pc-windows-msvc --manifest-path native/windows-sandbox/Cargo.toml --bin pi-windows-sandbox --example python_isolation_acceptance 2>&1 | Tee-Object -FilePath python-isolation-evidence/feature-check.log
          if ($LASTEXITCODE -ne 0) { throw 'Original lab feature compilation failed; no staging.' }
          rustup run stable cargo check --locked --no-default-features --features lab-python-policy-repair-comparison --target x86_64-pc-windows-msvc --manifest-path native/windows-sandbox/Cargo.toml --bin pi-windows-sandbox --example python_isolation_acceptance 2>&1 | Tee-Object -FilePath python-isolation-evidence/policy-feature-check.log
          if ($LASTEXITCODE -ne 0) { throw 'Approved policy comparison compilation failed; no staging.' }
          rustup run stable cargo build --locked --no-default-features --features lab-python-policy-repair-comparison --target x86_64-pc-windows-msvc --manifest-path native/windows-sandbox/Cargo.toml --bin pi-windows-sandbox --example python_isolation_acceptance 2>&1 | Tee-Object -FilePath python-isolation-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native build/link failed; no staging.' }
          $build = "$PWD/native/windows-sandbox/target/x86_64-pc-windows-msvc/debug"
          [ordered]@{
            sourceCommit=$env:SOURCE_SHA;
            sourceManifestSha256=(Get-FileHash -LiteralPath SOURCE_SHA256SUMS.txt -Algorithm SHA256).Hash;
            lockfileSha256=(Get-FileHash -LiteralPath native/windows-sandbox/Cargo.lock -Algorithm SHA256).Hash;
            driverSha256=(Get-FileHash -LiteralPath "$build/examples/python_isolation_acceptance.exe" -Algorithm SHA256).Hash;
            helperSha256=(Get-FileHash -LiteralPath "$build/pi-windows-sandbox.exe" -Algorithm SHA256).Hash;
            fixtureSha256=(Get-FileHash -LiteralPath scripts/python-isolation-fixture.py -Algorithm SHA256).Hash;
            pythonSha256=(Get-FileHash -LiteralPath $env:PYTHON_EXECUTABLE -Algorithm SHA256).Hash;
            pythonVersion='3.12.10'; architecture='x64';
            labVariant='lab-python-policy-repair-comparison'; additionalAccountConnectFilters=2;
            provenance='Pinned source, installed official Rust/MSVC, official setup-python exact runtime. Per-run hashes are not independent compiler or upstream runtime provenance verification.'
          } | ConvertTo-Json | Set-Content -LiteralPath python-isolation-evidence/build-identity.json -Encoding UTF8
      - name: Verify pure native contracts before any lab security setup
        run: |
          rustup run stable cargo test --locked --no-default-features --features lab-python-policy-repair-comparison --target x86_64-pc-windows-msvc --manifest-path native/windows-sandbox/Cargo.toml --test python_isolation_contract --test admission_policy_contract --test wfp_offline_scope_contract --test broker_wait_contract --test startup_diagnostics_contract 2>&1 | Tee-Object -FilePath python-isolation-evidence/native-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Pure native contracts failed; no staging or setup.' }
          # This exact module contains only four pure spec/shape tests; never run
          # the full Windows library security-test suite before authorization.
          rustup run stable cargo test --locked --no-default-features --features lab-python-policy-repair-comparison --target x86_64-pc-windows-msvc --manifest-path native/windows-sandbox/Cargo.toml --lib network::wfp::tests:: 2>&1 | Tee-Object -FilePath python-isolation-evidence/native-wfp-scope-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Pure WFP scope guards failed; no staging or setup.' }
      - name: Stage fixed protected lab and approved synthetic outside-world leaf
        id: stage
        env:
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          $identity = Get-Content -LiteralPath python-isolation-evidence/build-identity.json -Raw | ConvertFrom-Json
          ./scripts/stage_windows_python_isolation.ps1 -Phase Stage -ApprovedDisposableVm `
            -PythonHome ([IO.Path]::GetDirectoryName($env:PYTHON_EXECUTABLE)) -BuildDirectory "$PWD/native/windows-sandbox/target/x86_64-pc-windows-msvc/debug" `
            -ExpectedDriverSha256 $identity.driverSha256 -ExpectedHelperSha256 $identity.helperSha256 `
            -ExpectedFixtureSha256 $identity.fixtureSha256 -ExpectedPythonSha256 $identity.pythonSha256 `
            -ApprovedSourceSha256 $identity.sourceManifestSha256 -SourceCommit $identity.sourceCommit 2>&1 | Tee-Object -FilePath python-isolation-evidence/stage.log
      - name: Create fixed benign contents and set up owned account and offline protection
        id: setup
        run: |
          ./scripts/stage_windows_python_isolation.ps1 -Phase Setup -ApprovedDisposableVm 2>&1 | Tee-Object -FilePath python-isolation-evidence/setup.log
      - name: Observe only five owned ActiveStore rules without changing policy
        id: firewall_observation
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Optional metadata only. No audit/capture, policy changes, broad rule
          # enumeration, account-name lookup, raw identities or raw error output.
          $ErrorActionPreference = 'Stop'
          $WarningPreference = 'SilentlyContinue'
          $InformationPreference = 'SilentlyContinue'
          $VerbosePreference = 'SilentlyContinue'
          $DebugPreference = 'SilentlyContinue'
          $ProgressPreference = 'SilentlyContinue'
          function Safe-Enum($Value, [string[]]$Allowed) {
            $text = [string]$Value
            if ($Allowed -ccontains $text) { return $text }
            return 'UNKNOWN'
          }
          function Diagnostic([string]$Stage, [string]$Status, [string]$Reason, $Record=$null) {
            $category = 'NONE'; $code = $null
            if ($null -ne $Record) {
              try { $code = [int]$Record.Exception.HResult } catch { $code = $null }
              try { $category = Safe-Enum $Record.CategoryInfo.Category @('NotSpecified', 'OpenError', 'CloseError', 'DeviceError', 'InvalidArgument', 'InvalidData', 'InvalidOperation', 'InvalidResult', 'InvalidType', 'MetadataError', 'NotImplemented', 'NotInstalled', 'ObjectNotFound', 'OperationStopped', 'OperationTimeout', 'SyntaxError', 'ParserError', 'PermissionDenied', 'ResourceBusy', 'ResourceExists', 'ResourceUnavailable', 'ReadError', 'WriteError', 'SecurityError', 'ProtocolError', 'ConnectionError', 'AuthenticationError', 'LimitsExceeded', 'QuotaExceeded', 'NotEnabled') } catch { $category = 'UNKNOWN' }
            }
            return [ordered]@{ stage=$Stage; status=$Status; reason=$Reason; hresult=$code; errorCategory=$category }
          }
          function Property-Value($Object, [string]$Name) {
            if ($null -eq $Object) { throw 'DEPENDENCY_UNAVAILABLE' }
            $property = $Object.PSObject.Properties[$Name]
            if ($null -eq $property -or $null -eq $property.Value) { throw 'PROPERTY_UNAVAILABLE' }
            return $property.Value
          }
          function Query-One([string]$Stage, [scriptblock]$Read) {
            try {
              $items = @(& $Read)
              if ($items.Count -eq 0) { return @{ item=$null; diagnostic=(Diagnostic $Stage 'INCONCLUSIVE' 'MISSING_OBJECT') } }
              if ($items.Count -ne 1) { return @{ item=$null; diagnostic=(Diagnostic $Stage 'INCONCLUSIVE' 'DUPLICATE_OBJECT') } }
              return @{ item=$items[0]; diagnostic=(Diagnostic $Stage 'OBSERVED' 'NONE') }
            } catch { return @{ item=$null; diagnostic=(Diagnostic $Stage 'INCONCLUSIVE' 'QUERY_ERROR' $_) } }
          }
          function Read-Fact([string]$Stage, [scriptblock]$Read) {
            try {
              $values = @(& $Read)
              if ($values.Count -lt 1 -or $values.Count -gt 8) { throw 'FIELD_CARDINALITY' }
              # Only helper-normalized enums and actual Boolean values may escape.
              foreach ($value in $values) {
                if ($value -isnot [bool] -and ($value -isnot [string] -or $factEnums -cnotcontains $value)) { throw 'UNSAFE_FIELD_TYPE' }
              }
              if ($values -ccontains 'UNKNOWN' -or $values -ccontains 'Unknown' -or $values -ccontains 'OTHER_OR_UNKNOWN') {
                $fact = Diagnostic $Stage 'INCONCLUSIVE' 'UNRECOGNIZED_VALUE'
              } else { $fact = Diagnostic $Stage 'OBSERVED' 'NONE' }
              $fact.value = if ($values.Count -eq 1) { $values[0] } else { $values }
              return $fact
            } catch {
              $fact = Diagnostic $Stage 'INCONCLUSIVE' 'FIELD_ERROR' $_
              $fact.value=$null
              return $fact
            }
          }
          function Protocol-Value($Value) {
            switch -CaseSensitive ([string]$Value) {
              '256' { return 'Any' }; '6' { return 'TCP' }; '17' { return 'UDP' }
              default { return (Safe-Enum $Value @('Any', 'TCP', 'UDP')) }
            }
          }
          function Profile-Value($Value) {
            $parts = @(([string]$Value).Split(',') | ForEach-Object { $_.Trim() } | Sort-Object -Unique)
            if ($parts.Count -eq 1 -and $parts[0] -ceq 'Any') { return 'ANY' }
            if (($parts -join ',') -ceq 'Domain,Private,Public') { return 'ALL_THREE' }
            return 'OTHER_OR_UNKNOWN'
          }
          function Expected-Match($Fact, $Expected) {
            if ($Fact.status -cne 'OBSERVED') { return $null }
            return $Fact.value -ceq $Expected
          }
          function Is-Any($Value) {
            $values = @($Value)
            return $values.Count -eq 1 -and [string]$values[0] -in @('Any', '*')
          }
          function Address-Key([string]$Value) {
            # Numeric parsing only: no DNS, sockets, or address resolution.
            if ($Value.Length -gt 128 -or $Value.Contains('%')) { throw 'ADDRESS_SHAPE' }
            $parts = $Value.Trim().Split('/')
            if ($parts.Count -eq 2) {
              $address = [Net.IPAddress]::Parse($parts[0])
              $low = $address.GetAddressBytes(); $high = $address.GetAddressBytes()
              if ($parts[1].Contains('.')) {
                $maskBytes = ([Net.IPAddress]::Parse($parts[1])).GetAddressBytes()
                if ($low.Length -ne 4 -or $maskBytes.Length -ne 4) { throw 'ADDRESS_MASK' }
                $maskBits = -join @($maskBytes | ForEach-Object { [Convert]::ToString($_, 2).PadLeft(8, '0') })
                if ($maskBits -cnotmatch '\A1*0*\z') { throw 'ADDRESS_MASK' }
                $bits = $maskBits.TrimEnd('0').Length
              } else { $bits = [int]$parts[1] }
              if ($bits -lt 0 -or $bits -gt ($low.Length * 8)) { throw 'ADDRESS_SHAPE' }
              for ($i = 0; $i -lt $low.Length; $i++) {
                $remaining = [Math]::Max(0, [Math]::Min(8, $bits - (8 * $i)))
                $mask = (255 -shl (8 - $remaining)) -band 255
                $low[$i] = $low[$i] -band $mask
                $high[$i] = $low[$i] -bor (255 -bxor $mask)
              }
            } elseif ($parts.Count -eq 1) {
              $range = $Value.Trim().Split('-')
              if ($range.Count -gt 2) { throw 'ADDRESS_SHAPE' }
              $low = ([Net.IPAddress]::Parse($range[0])).GetAddressBytes()
              $high = ([Net.IPAddress]::Parse($range[-1])).GetAddressBytes()
              if ($low.Length -ne $high.Length) { throw 'ADDRESS_SHAPE' }
            } else { throw 'ADDRESS_SHAPE' }
            return ([Convert]::ToHexString($low) + '-' + [Convert]::ToHexString($high))
          }
          function Address-Set($Values) {
            $parts = @($Values | ForEach-Object { ([string]$_).Split(',') })
            if ($parts.Count -lt 1 -or $parts.Count -gt 16) { throw 'ADDRESS_COUNT' }
            return (@($parts | ForEach-Object { Address-Key $_ } | Sort-Object -Unique) -join ',')
          }
          function User-Scope-Matches($Value, [string]$Sid) {
            if (-not $Sid -or ([string]$Value).Length -gt 4096) { return $false }
            $descriptor = [Security.AccessControl.RawSecurityDescriptor]::new([string]$Value)
            if ($null -eq $descriptor.DiscretionaryAcl -or $descriptor.DiscretionaryAcl.Count -ne 1) { return $false }
            $ace = $descriptor.DiscretionaryAcl[0]
            return $ace -is [Security.AccessControl.CommonAce] -and -not $ace.IsCallback -and
              $ace.AceQualifier -eq [Security.AccessControl.AceQualifier]::AccessAllowed -and
              $ace.AceFlags -eq [Security.AccessControl.AceFlags]::None -and
              $ace.AccessMask -eq 1 -and $ace.SecurityIdentifier.Value -ceq $Sid
          }
          $specifications = @(
            @{ name='pi_sandbox_offline_block_outbound'; direction='Outbound'; protocol='Any'; addresses='0.0.0.0-126.255.255.255,128.0.0.0-255.255.255.255,::,::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff' },
            @{ name='pi_sandbox_offline_block_inbound'; direction='Inbound'; protocol='Any'; addresses='0.0.0.0-126.255.255.255,128.0.0.0-255.255.255.255,::,::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff' },
            @{ name='pi_sandbox_offline_block_loopback_tcp'; direction='Outbound'; protocol='TCP'; addresses='127.0.0.0/8,::/127' },
            @{ name='pi_sandbox_offline_block_loopback_udp'; direction='Outbound'; protocol='UDP'; addresses='127.0.0.0/8,::/127' },
            @{ name='pi_sandbox_offline_block_loopback_inbound'; direction='Inbound'; protocol='Any'; addresses='127.0.0.0/8,::/127' }
          )
          $entries = [Collections.Generic.List[object]]::new()
          $accountSid = $null
          $baselineDiagnostic = Diagnostic 'BASELINE_IDENTITY' 'INCONCLUSIVE' 'UNAVAILABLE'
          try {
            . ./scripts/windows_lab_stage_sources.ps1
            $baselinePath = 'C:\PiSandboxLab\trusted\python-isolation-baseline.json'
            Assert-LabSourceAncestors -Path $baselinePath -Role 'optional-firewall-baseline'
            if ((Get-Item -LiteralPath $baselinePath).Length -gt 8388608) { throw 'BASELINE_BOUND' }
            $candidate = (Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json).accountSid
            if ($candidate -cnotmatch '\AS-1-5-21-[0-9]+-[0-9]+-[0-9]+-[0-9]+\z' -or $candidate.Length -gt 184) { throw 'BASELINE_IDENTITY' }
            $accountSid = ([Security.Principal.SecurityIdentifier]::new($candidate)).Value
            $baselineDiagnostic = Diagnostic 'BASELINE_IDENTITY' 'OBSERVED' 'NONE'
          } catch { $accountSid = $null; $baselineDiagnostic = Diagnostic 'BASELINE_IDENTITY' 'INCONCLUSIVE' 'BASELINE_ERROR' $_ }
          $enforcementEnums = @('Full', 'NotApplicable', 'FirewallOffInProfile', 'CategoryOff', 'DisabledObject', 'InactiveProfile', 'LocalAddressResolutionEmpty', 'RemoteAddressResolutionEmpty', 'LocalPortResolutionEmpty', 'RemotePortResolutionEmpty', 'InterfaceResolutionEmpty', 'ApplicationResolutionEmpty', 'RemoteMachineEmpty', 'RemoteUserEmpty', 'LocalGlobalOpenPortsDisallowed', 'LocalAuthorizedApplicationsDisallowed', 'LocalFirewallRulesDisallowed', 'LocalConsecRulesDisallowed', 'NotTargetPlatform', 'OptimizedOut', 'LocalUserEmpty', 'TransportMachinesEmpty', 'TunnelMachinesEmpty')
          $factEnums = $enforcementEnums + @('UNKNOWN', 'OK', 'Degraded', 'Error', 'Unknown', 'Block', 'Allow', 'NotConfigured', 'Inbound', 'Outbound', 'True', 'False', 'Any', 'TCP', 'UDP', 'ANY', 'ALL_THREE', 'OTHER_OR_UNKNOWN')
          foreach ($spec in $specifications) {
            # Each query and each field is isolated. A failed SDDL/address parse
            # never removes successfully observed rule status or other filters.
            # COM INetFwRule.SetName writes the friendly label (DisplayName),
            # not NetSecurity's distinct unique Name/ID. These fixed labels have
            # no wildcard or indirect localization syntax; exact postcheck follows.
            $ruleQuery = Query-One 'RULE_QUERY' {
              Get-NetFirewallRule -PolicyStore ActiveStore -DisplayName $spec.name -ErrorAction Stop
            }
            $rule = $ruleQuery.item
            if ($null -ne $rule) {
              try {
                if ((Property-Value $rule 'DisplayName') -cne $spec.name) { throw 'DISPLAY_NAME_MISMATCH' }
              } catch { $rule=$null; $ruleQuery.diagnostic=(Diagnostic 'RULE_DISPLAY_NAME' 'INCONCLUSIVE' 'DISPLAY_NAME_UNAVAILABLE_OR_MISMATCH' $_) }
            }
            $addressQuery = Query-One 'ADDRESS_QUERY' {
              if ($null -eq $rule) { throw 'RULE_UNAVAILABLE' }
              Get-NetFirewallAddressFilter -AssociatedNetFirewallRule $rule -ErrorAction Stop
            }
            $portQuery = Query-One 'PORT_QUERY' {
              if ($null -eq $rule) { throw 'RULE_UNAVAILABLE' }
              Get-NetFirewallPortFilter -AssociatedNetFirewallRule $rule -ErrorAction Stop
            }
            $securityQuery = Query-One 'SECURITY_QUERY' {
              if ($null -eq $rule) { throw 'RULE_UNAVAILABLE' }
              Get-NetFirewallSecurityFilter -AssociatedNetFirewallRule $rule -ErrorAction Stop
            }
            $address=$addressQuery.item; $port=$portQuery.item; $security=$securityQuery.item
            $fields = [ordered]@{
              enforcementStatus=(Read-Fact 'ENFORCEMENT_STATUS' { Property-Value $rule 'EnforcementStatus' | ForEach-Object { Safe-Enum $_ $enforcementEnums } });
              primaryStatus=(Read-Fact 'PRIMARY_STATUS' { Safe-Enum (Property-Value $rule 'PrimaryStatus') @('OK', 'Degraded', 'Error', 'Unknown') });
              action=(Read-Fact 'ACTION' { Safe-Enum (Property-Value $rule 'Action') @('Block', 'Allow', 'NotConfigured') });
              direction=(Read-Fact 'DIRECTION' { Safe-Enum (Property-Value $rule 'Direction') @('Inbound', 'Outbound') });
              enabled=(Read-Fact 'ENABLED' { Safe-Enum (Property-Value $rule 'Enabled') @('True', 'False') });
              profile=(Read-Fact 'PROFILE' { Profile-Value (Property-Value $rule 'Profile') });
              protocol=(Read-Fact 'PROTOCOL' { Protocol-Value (Property-Value $port 'Protocol') });
              localAddressAny=(Read-Fact 'LOCAL_ADDRESS' { Is-Any (Property-Value $address 'LocalAddress') });
              remoteAddressScope=(Read-Fact 'REMOTE_ADDRESS' { (Address-Set (Property-Value $address 'RemoteAddress')) -ceq (Address-Set $spec.addresses) });
              localPortAny=(Read-Fact 'LOCAL_PORT' { Is-Any (Property-Value $port 'LocalPort') });
              remotePortAny=(Read-Fact 'REMOTE_PORT' { Is-Any (Property-Value $port 'RemotePort') });
              localUserScope=(Read-Fact 'LOCAL_USER_SCOPE' {
                if (-not $accountSid) { throw 'BASELINE_UNAVAILABLE' }
                User-Scope-Matches (Property-Value $security 'LocalUser') $accountSid
              });
              remoteUserAny=(Read-Fact 'REMOTE_USER_SCOPE' { Is-Any (Property-Value $security 'RemoteUser') });
              remoteMachineAny=(Read-Fact 'REMOTE_MACHINE_SCOPE' { Is-Any (Property-Value $security 'RemoteMachine') })
            }
            $matches = [ordered]@{
              action=(Expected-Match $fields.action 'Block'); direction=(Expected-Match $fields.direction $spec.direction);
              enabled=(Expected-Match $fields.enabled 'True');
              profile=$(if ($fields.profile.status -ceq 'OBSERVED') { $fields.profile.value -in @('ANY', 'ALL_THREE') } else { $null });
              protocol=(Expected-Match $fields.protocol $spec.protocol)
            }
            foreach ($key in @('localAddressAny', 'remoteAddressScope', 'localPortAny', 'remotePortAny', 'localUserScope', 'remoteUserAny', 'remoteMachineAny')) {
              $matches[$key] = Expected-Match $fields[$key] $true
            }
            $queryDiagnostics = [ordered]@{ rule=$ruleQuery.diagnostic; address=$addressQuery.diagnostic; port=$portQuery.diagnostic; security=$securityQuery.diagnostic }
            $complete = @($fields.Values | Where-Object { $_.status -cne 'OBSERVED' }).Count -eq 0 -and
              @($queryDiagnostics.Values | Where-Object { $_.status -cne 'OBSERVED' }).Count -eq 0
            $entries.Add([pscustomobject][ordered]@{
              name=$spec.name; observation=$(if ($complete) { 'OBSERVED' } else { 'INCONCLUSIVE' });
              queries=$queryDiagnostics; fields=$fields; baselineIdentityAvailable=([bool]$accountSid);
              expectedMatches=$matches; expectedMatchesComplete=(@($matches.Values | Where-Object { $null -eq $_ }).Count -eq 0);
              allExpectedMatches=(@($matches.Values | Where-Object { $_ -ne $true }).Count -eq 0)
            })
          }
          try {
            [ordered]@{
              schemaVersion=2; sourceCommit=$env:GITHUB_SHA; policyStore='ActiveStore'; optional=$true;
              observationOnly=$true; provesConnectionBlocking=$false; liveConnectionObservationsAuthoritative=$true;
              status=$(if (@($entries | Where-Object { $_.observation -cne 'OBSERVED' }).Count -eq 0) { 'OBSERVED' } else { 'INCONCLUSIVE' });
              baseline=$baselineDiagnostic; entries=$entries.ToArray()
            } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath python-isolation-evidence/python-isolation-firewall-active-store.json -Encoding UTF8
          } catch { Write-Output 'Optional ActiveStore metadata unavailable; fixed runtime observations remain required.' }
          exit 0
      - name: Run fixed controls and separate cap-only policy candidate once
        id: run
        run: |
          # All network controls/probes are confined to 127.0.0.1:43871 and
          # [::1]:43872. No DNS, external endpoint or package install is allowed.
          ./scripts/stage_windows_python_isolation.ps1 -Phase Run -ApprovedDisposableVm 2>&1 | Tee-Object -FilePath python-isolation-evidence/run.log
      - name: Always attempt scoped owned-account disable after setup attempt
        id: disable
        if: ${{ always() && steps.stage.outcome == 'success' && steps.setup.outcome != 'skipped' }}
        run: |
          # Authenticated store selects the owned SID. Never delete/substitute
          # accounts, broaden ACLs, retry, or launch a host fallback.
          ./scripts/stage_windows_python_isolation.ps1 -Phase Disable -ApprovedDisposableVm 2>&1 | Tee-Object -FilePath python-isolation-evidence/disable.log
      - name: Copy only fixed named non-secret JSON evidence
        if: ${{ always() && steps.stage.outcome == 'success' }}
        env:
          FINAL_DISABLE_OUTCOME: ${{ steps.disable.outcome }}
        run: |
          . ./scripts/windows_lab_stage_sources.ps1
          foreach ($name in @(
            'python-isolation-stage.json', 'python-isolation-runtime-manifest.json', 'python-isolation-baseline.json',
            'python-isolation-ordinary-outside.json',
            'python-isolation-strict-boundary.json', 'python-isolation-strict-child-normal-exit.json', 'python-isolation-strict-child-timeout.json',
            'python-isolation-pinned-boundary.json', 'python-isolation-pinned-child-normal-exit.json', 'python-isolation-pinned-child-timeout.json',
            'python-isolation-candidate-boundary.json', 'python-isolation-candidate-child-normal-exit.json', 'python-isolation-candidate-child-timeout.json',
            'python-isolation-run.json', 'python-isolation-recovery.json', 'python-isolation-summary.json')) {
            $source = Join-Path 'C:\PiSandboxLab\trusted' $name
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Assert-LabSourceAncestors -Path $source -Role 'isolation-evidence'
              if ((Get-Item -LiteralPath $source).Length -gt 8388608) { throw 'Isolation evidence exceeds bound.' }
              Copy-Item -LiteralPath $source -Destination (Join-Path 'python-isolation-evidence' $name)
            }
          }
          "Final explicit disable step: $env:FINAL_DISABLE_OUTCOME. Failure requires investigation and fresh hosted VM disposal." | Add-Content $env:GITHUB_STEP_SUMMARY
          'LAB ONLY: original strict/pinned controls and cap-only/upstream-DACL candidate remain separate; all use the two dedicated-account ALE connect blocks. Parent-death is NOT_TESTED and full isolation acceptance is unavailable in this revision. Production activation stays false.' | Add-Content $env:GITHUB_STEP_SUMMARY
          'Account disable retains all 14 scoped WFP filters until disposable VM teardown; no reboot/BFE-restart or inbound/protocol-completeness claim.' | Add-Content $env:GITHUB_STEP_SUMMARY
          'Per-run all-file runtime hashes bind observed bytes; they do not independently prove upstream provenance. No automatic in-job retry or host fallback. Dispose the fresh VM through hosted job teardown.' | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Retain only allowlisted safe JSON and logs, never credentials or store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, official release
        with:
          name: windows-python-isolation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            python-isolation-evidence/source-identity.json
            python-isolation-evidence/source-manifest-verification.json
            python-isolation-evidence/python-version.log
            python-isolation-evidence/source-contract-tests.log
            python-isolation-evidence/fixture-contract-tests.log
            python-isolation-evidence/toolchain.log
            python-isolation-evidence/default-check.log
            python-isolation-evidence/feature-check.log
            python-isolation-evidence/policy-feature-check.log
            python-isolation-evidence/build.log
            python-isolation-evidence/build-identity.json
            python-isolation-evidence/native-contract-tests.log
            python-isolation-evidence/native-wfp-scope-tests.log
            python-isolation-evidence/stage.log
            python-isolation-evidence/setup.log
            python-isolation-evidence/run.log
            python-isolation-evidence/disable.log
            python-isolation-evidence/python-isolation-stage.json
            python-isolation-evidence/python-isolation-runtime-manifest.json
            python-isolation-evidence/python-isolation-baseline.json
            python-isolation-evidence/python-isolation-ordinary-outside.json
            python-isolation-evidence/python-isolation-strict-boundary.json
            python-isolation-evidence/python-isolation-strict-child-normal-exit.json
            python-isolation-evidence/python-isolation-strict-child-timeout.json
            python-isolation-evidence/python-isolation-pinned-boundary.json
            python-isolation-evidence/python-isolation-pinned-child-normal-exit.json
            python-isolation-evidence/python-isolation-pinned-child-timeout.json
            python-isolation-evidence/python-isolation-candidate-boundary.json
            python-isolation-evidence/python-isolation-candidate-child-normal-exit.json
            python-isolation-evidence/python-isolation-candidate-child-timeout.json
            python-isolation-evidence/python-isolation-run.json
            python-isolation-evidence/python-isolation-recovery.json
            python-isolation-evidence/python-isolation-summary.json
