name: Windows build and safe basic tests

# Intentionally manual only. No pull_request, push, schedule or workflow_run.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed full 40-character commit SHA in this repository'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-basic:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Validate immutable source selection
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a full lowercase commit SHA'
          }
      - name: Check out reviewed source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checked-out identity and record runner
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:SOURCE_SHA) { throw 'Source identity mismatch' }
          "SOURCE_SHA=$actual"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Select official stable Windows MSVC toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup run stable rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain unavailable' }
      - name: Install pinned optional smoke-test dependencies without npm scripts
        run: |
          npm install --prefix .local/pi-sdk-smoke --ignore-scripts --no-audit --no-fund --save-exact @earendil-works/pi-coding-agent@1.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Pi SDK installation failed' }
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          if ($LASTEXITCODE -ne 0) { throw 'Schema validator installation failed' }
      - name: Build, link and run explicitly allowlisted safe tests
        run: |
          python scripts/run_windows_basic_ci.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows basic validation failed' }
      - name: Record scope
        if: always()
        run: |
          @'
          ## Scope of this manual run
          Native Windows MSVC build/link plus safe basic regression tests only.
          No account, ACL, token-policy, firewall/WFP, security-setting or native sandbox execution tests.
          Production activation remains disabled. A green run is NOT Windows sandbox enforcement validation.
          Exact source identity and individual test results are in the logs.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
