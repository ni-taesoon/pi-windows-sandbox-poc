[package]
name = "pi-windows-sandbox"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[workspace]
[features]
default = []
lab-python-isolation-acceptance = []
lab-python-codex-policy-acceptance = ["lab-python-isolation-acceptance"]
lab-python-policy-repair-comparison = ["lab-python-isolation-acceptance"]
lab-python-logon-sid-comparison = ["lab-python-policy-repair-comparison"]
lab-minimal-load-comparison = []
lab-pinned-codex-token-comparison = ["lab-minimal-load-comparison"]
lab-loader-trace = []
lab-loader-probe = []
lab-sechost-breakpoints = ["lab-loader-trace", "lab-loader-probe"]
[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[target.'cfg(windows)'.dependencies]
zeroize = "1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Variant"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_Storage_FileSystem", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_System_Rpc", "Win32_Graphics_Gdi"] }
[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
